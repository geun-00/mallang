name: Deploy To EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: JDK 설치
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 빌드
        run: ./gradlew bootJar

      - name: AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 생성
        run: docker build -t mallang-server .

      - name: Docker 이미지 Tag 붙이기
        run: docker tag mallang-server ${{ steps.login-ecr.outputs.registry }}/mallang-server:latest

      - name: ECR에 Docker 이미지 Push
        run: docker push ${{ steps.login-ecr.outputs.registry }}/mallang-server:latest

      - name: EC2에 운영 환경 파일 생성
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            mkdir -p /home/ubuntu/.mallang
            cat > /home/ubuntu/.mallang/.env <<'EOF'
            ${{ secrets.PROD_ENV_FILE }}
            EOF
            chmod 600 /home/ubuntu/.mallang/.env

      - name: 압축
        run: tar -czvf $GITHUB_SHA.tar.gz appspec.yml scripts

      - name: S3에 프로젝트 폴더 업로드
        run: aws s3 cp --region ap-northeast-2 ./$GITHUB_SHA.tar.gz s3://mallang-server/$GITHUB_SHA.tar.gz

      - name: Code Deploy로 EC2에 프로젝트 코드 배포
        run: |
          aws deploy create-deployment \
            --application-name mallang-server \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name Production \
            --s3-location bucket=mallang-server,bundleType=tgz,key=$GITHUB_SHA.tar.gz
