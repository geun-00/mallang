spring:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        order_updates: true
        order_inserts: true
        jdbc:
          batch_size: 50

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

decorator:
  datasource:
    p6spy:
      enable-logging: false
