spring:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        order_updates: true
        order_inserts: true
        jdbc:
          batch_size: 50

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

decorator:
  datasource:
    p6spy:
      enable-logging: false

---
spring:
  config:
    activate:
      on-profile: debug

  jpa:
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true
        generate_statistics: true

decorator:
  datasource:
    p6spy:
      enable-logging: true

logging:
  level:
    io.mallang.product.adapter.persistence.mybatis: trace
    org.hibernate.orm.jdbc.bind: trace