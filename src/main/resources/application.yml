spring:

  profiles:
    default: local

  flyway:
    baseline-on-migrate: true

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?reWriteBatchedInserts=true
    driver-class-name: org.postgresql.Driver
    username: root
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true
        order_updates: true
        order_inserts: true
        jdbc:
          batch_size: 50
        generate_statistics: true
    open-in-view: false

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml

---
spring:
  config:
    activate:
      on-profile: prod

  flyway:
    baseline-on-migrate: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        highlight_sql: false
        generate_statistics: false
