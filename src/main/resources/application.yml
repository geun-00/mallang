spring:
  application:
    name: mallang

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?reWriteBatchedInserts=true
    driver-class-name: org.postgresql.Driver
    username: root
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        highlight_sql: true
        order_updates: true
        order_inserts: true
        jdbc:
          batch_size: 50
        generate_statistics: true